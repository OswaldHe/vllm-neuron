  # instruction is to implement the floorplan's scheme as the priority and then compare the
  # two candidates, so until a pipeline executes this FAILs, and the FAIL is the signal to
  # build it rather than to describe it again.
  #
  # The blockers are real and all of them are reachable from `scope.editable`; a FAIL here is
  # a work item, not an impossibility:
  # - no `IntermediateTensors` in `vllm_neuron` — thread them through `model.py` and
  # `vllm/worker/neuron_model_runner.py`, both editable;
  # - no pipeline process group — `parallel/neuron_parallel_state.py` is editable and is
  # where the groups are built;
  # - `NeuronDeviceCommunicator.send/recv` stage through host DRAM over gloo, which puts a
  # host round trip on every stage boundary. `nki.collectives.collective_permute` exists
  # in the installed toolchain and `kernels/` is editable, so a device-side p2p kernel is
  # the in-scope route. The XLA lowering in `libtorch_neuronx_lite/overrides/
  # xla_collectives.py` is vendored and NOT editable — go around it, not through it.
  #
  # Report the floorplan's bandwidth case on its own terms. Its argument for pipelining is
  # bank-bandwidth-bound decode and lower per-bank weight residency, not capacity. "The
  # weights already fit" answers a different question and does not settle it.
  # FAIL if the floorplan was not read, if a candidate was dismissed or adopted without
  # evidence, if a measured candidate's verifier run did not pass, if the factorization does
  # not account for all 64 ranks, or if the evidence does not let you tell.
  #
  # A FAIL is expected while pipeline parallelism is being built — there is nothing to
  # measure until there is a PP implementation. Say plainly which of the two candidates is
  # blocked on what, and what was built toward it this iteration, so the next one continues
  # rather than restating.
  # model: claude-sonnet-5
  # effort: medium
  # timeout: 900

metrics:
  # Gated at batch 1: all three figures. One sequence is where a latency change shows up
  # undiluted, and nothing about a single stream is at the mercy of the scheduler.
  - values:
      ttft_p50_ms_in512_bs1: lower
      ttft_p50_ms_in1024_bs1: lower
      ttft_p50_ms_in8192_bs1: lower
      tpot_p50_ms_in512_bs1: lower
      tpot_p50_ms_in1024_bs1: lower
      tpot_p50_ms_in8192_bs1: lower
      decode_tok_s_in512_bs1: higher
      decode_tok_s_in1024_bs1: higher
      decode_tok_s_in8192_bs1: higher

  # Gated at batch 10: TTFT and decode throughput only. TPOT is deliberately not gated here —
  # with ten requests in flight it moves with how the scheduler interleaved them and with how
  # many drafts were accepted, so it regresses and recovers for reasons an iteration did not
  # cause. It is still recorded below, because a TPOT that moved without a decode-throughput
  # change is a different fact than one that moved with it.
  - values:
      ttft_p50_ms_in512_bs10: lower
      ttft_p50_ms_in1024_bs10: lower
      ttft_p50_ms_in8192_bs4: lower
      decode_tok_s_in512_bs10: higher
      decode_tok_s_in1024_bs10: higher
      decode_tok_s_in8192_bs4: higher

  # Recorded, not gated.
  - gate: false
    values:
      tpot_p50_ms_in512_bs10: lower
      tpot_p50_ms_in1024_bs10: lower
      tpot_p50_ms_in8192_bs4: lower
      # Acceptance is a first-order term in every throughput figure above, so it is here to
      # explain them: a decode gain that is really an acceptance gain is a different result.
      # Not gated, because it moves with what the model happened to generate.
      vllm_acceptance_pct_in512_bs1: higher
      vllm_acceptance_pct_in1024_bs1: higher
      vllm_acceptance_pct_in8192_bs1: higher
      vllm_acceptance_pct_in512_bs10: higher
      vllm_acceptance_pct_in1024_bs10: higher
      vllm_acceptance_pct_in8192_bs4: higher

acceptance:
  # How far any gated metric may regress from the best an earlier iteration reached — best so
  # far, not the previous iteration, so progress cannot be given back a few percent at a time.
  #
  # 5%, and the measurement now earns it. A clean measured window repeats to under 1% on this
  # host (0.2% at in512_bs1, 0.6% at in512_bs10, 0.5% at in1024_bs10), so 5% is well clear of
  # the noise floor rather than hiding in it. What 5% is really sized for is the honest
  # trade — a fusion that costs a little TTFT to win decode throughput should survive one
  # iteration and be judged on the next.
  max_regression_pct: 5

scope:
  editable:
    - vllm_neuron/model/deepseek_v41/__init__.py
    - vllm_neuron/model/deepseek_v41/config.py
    - vllm_neuron/model/deepseek_v41/factory.py
    - vllm_neuron/model/deepseek_v41/model.py
    - vllm_neuron/model/deepseek_v41/weight_loader.py
    - vllm_neuron/model/deepseek_v41/drafter.py
    - vllm_neuron/model/deepseek_v41/kernels
    # `verifier/` and `bench/` are deliberately NOT editable. They are the measurement, and an
    # iteration that can edit its own measurement can improve the number without improving the
    # model — "it got faster" and "it measured less" print the same line.

agent:
  type: claude

budget:
  iterations: 16
  iteration_time: 4h      # per-iteration deadline (the agent sees the countdown)

# ── Per-iteration guidance ──────────────────────────────────────────────────────────────────
#
# Prose attached to iteration ranges, injected into that iteration's prompt. Guidance only:
# nothing checks it, and only the constraints and the metric gates decide what is kept. Slots
# are indexed by iteration number, not by accepted count, and may not overlap.
# iteration_constraints: []

# ── The reviewer ────────────────────────────────────────────────────────────────────────────
#
# Reads each iteration and can reject it independently of the metrics. Worth having above all
# else here: a number that improved because less was measured looks exactly like a number that
# improved.
reviewer:
  prompt: |
    Review the iteration: what changed, what it bought, what it cost, with numbers.

    - Profile what the iteration touched — `neuron-framework-profile-analysis-vllm-neuron` or
      `neuron-nki-profile-analysis` — and name the operator that binds now. If the change did
      not move the binding operator, say so plainly.
    - Separate device-side gains from host-side ones, and check the measured windows were
      clean. A dirty window is not a measurement, and a gain that is really an acceptance
      change is not a gain in the kernel.
    - Report the compiled graph-variant count before and after. More variants is a cost even
      when the numbers improved.
    - Name the next fusion to attempt — within a block, then across blocks — with its expected
      impact and whether it fits one iteration.
  model: claude-sonnet-5
  timeout_seconds: 3000
